name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desk-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm build
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps --only-shell chromium webkit
      - run: pnpm test:pwa
      - name: Check that changed content has published pages
        if: >-
          github.event_name == 'pull_request' || (github.event_name == 'push' && !github.event.created && !github.event.deleted)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-published-content.mjs "$BASE_SHA"
      - name: Upload review build
        if: github.event_name == 'pull_request' && !github.event.pull_request.draft
        uses: actions/upload-artifact@v7.0.2
        with:
          name: desk-preview
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Record the deployed revision
        run: git rev-parse HEAD > dist/desk-revision.txt
      - name: Upload Pages build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist/

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Desk
        id: deployment
        uses: actions/deploy-pages@v5.0.1

      <use href="#desk-window"/>
    </g>
  </defs>
  <g class="app" display="none">
    <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#lavender)"/>
    <use href="#desk-window-with-shadow" x="24" y="27"/>
  </g>
  <g class="touch" display="none">
    <path fill="url(#lavender)" d="M0 0h128v128H0z"/>
    <use href="#desk-window-with-shadow" x="24" y="27"/>
  </g>
  <g class="maskable" display="none">
    <path fill="url(#lavender)" d="M0 0h128v128H0z"/>
    <use href="#desk-window-with-shadow" transform="translate(30 32) scale(.85)"/>
  </g>
  <g class="favicon" display="none" shape-rendering="crispEdges">
    <path fill="#454151" d="M0 0h128v128H0z"/>
    <path fill="#dedbe3" d="M8 8h112v112H8z"/>
    <path fill="#f9f8fc" d="M8 120V8h112v8H16v104z"/>
    <path fill="#a5a0b6" d="M16 16h104v16H16z"/>
